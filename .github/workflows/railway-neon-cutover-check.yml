name: Railway Neon cutover regression
on:
  push:
    branches: [feat/pair-live-v14-9-single-oa-railway]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-points:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pair_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: pair_live_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pair_test -d pair_live_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      TOPUP_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      WALLET_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migration hashes and schema
        run: |
          node --import tsx scripts/migrate.ts --apply
          node --import tsx scripts/migrate.ts --validate
      - name: Topup, withdrawal, replay, rollback and RLS on PostgreSQL
        run: node --import tsx --test --test-concurrency=1 tests/topup.test.ts tests/withdrawal.test.ts tests/topup-line-card.test.ts tests/topup-ledger-lock.test.ts tests/wallet-round-db.integration.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
