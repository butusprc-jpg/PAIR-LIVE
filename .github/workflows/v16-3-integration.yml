name: V16.3 integrated staging readiness
on:
  push:
    branches: [feat/pair-live-v16-1-real-camera-ocr]
    paths:
      - '.github/workflows/v16-3-integration.yml'
      - 'lib/rounds/result-announcement.ts'
      - 'lib/ocr/automatic-settlement.ts'
      - 'app/api/admin/ocr-evidence/confirm/route.ts'
      - 'components/AdminOcrEvidence.tsx'
      - 'tests/result-announcement*'
      - 'tests/round-ocr-candidate-db.integration.test.ts'
      - 'scripts/round-worker.ts'
      - 'lib/line/worker-pump.ts'
      - 'lib/ocr/one-shot-scan.ts'
      - 'modules/external-live/client/MemberLivePlayer.tsx'
      - 'app/api/round/result-announcement/route.ts'
      - 'app/page.tsx'
      - 'tests/worker-line-pump.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pair_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: pair_live_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pair_test -d pair_live_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      WALLET_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      OCR_CANDIDATE_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      RESULT_ANNOUNCEMENT_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      V16_ROUND_BUTTON_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      COUNTDOWN_V11_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr imagemagick
      - name: Guard every database target
        run: node --import tsx --input-type=module -e "import {assertTestTarget} from './lib/migration-manifest.ts'; for (const key of ['MIGRATION_TEST_DATABASE_URL','WALLET_TEST_DATABASE_URL','OCR_CANDIDATE_TEST_DATABASE_URL','RESULT_ANNOUNCEMENT_TEST_DATABASE_URL','V16_ROUND_BUTTON_TEST_DATABASE_URL','COUNTDOWN_V11_TEST_DATABASE_URL']) assertTestTarget(process.env[key])"
      - name: Apply and validate migration baseline
        run: |
          npm run db:migrate -- --apply
          npm run db:migrate -- --validate
      - name: Round start, countdown, OCR, announcement, refund, simulation and access tests
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/v16-round-buttons.test.ts
          tests/automatic-countdown.test.ts
          tests/adaptive-poll.test.ts
          tests/worker-line-pump.test.ts
          tests/round-broadcast.test.ts
          tests/countdown-v11-db.integration.test.ts
          tests/round-core.test.ts
          tests/camera-countdown.test.ts
          tests/one-shot-ocr.test.ts
          tests/round-ocr-candidate-db.integration.test.ts
          tests/result-announcement.test.ts
          tests/result-announcement-db.integration.test.ts
          tests/wallet-round-db.integration.test.ts
          tests/points-simulation.test.ts
          tests/admin-navigation.test.ts
          modules/admin-auth/tests/admin-guard.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
