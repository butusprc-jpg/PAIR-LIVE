name: V13 owner usage tests
on:
  push:
    branches: [feat/pair-live-v13-owner-usage-dashboard]
  pull_request:
    branches: [feat/pair-live-v8-v11-integration]
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pair_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: pair_live_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pair_test -d pair_live_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      TOPUP_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      WALLET_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      OWNER_USAGE_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y imagemagick tesseract-ocr
      - run: npm ci
      - run: node --import tsx scripts/migrate.ts --apply
      - run: node --import tsx scripts/migrate.ts --validate
      - run: npm test
      - run: git fetch --no-tags --depth=1 origin cb94edf23a86d59baa6e1a9ac8aca8d15795eb7f
      - run: node --import tsx scripts/test-v12-v13-migrations.ts
      - run: npx tsc --noEmit
      - run: npm run build
