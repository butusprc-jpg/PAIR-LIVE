name: PAIR LIVE admin save regression
on:
  push:
    branches:
      - feat/pair-live-shrimp-logo-round-reset
    paths:
      - 'app/admin/**'
      - 'components/AdminCameras.tsx'
      - 'components/AdminBusinessSettings.tsx'
      - 'components/AdminRoleManagement.tsx'
      - 'components/Topup.tsx'
      - 'app/api/admin/**'
      - 'lib/admin-display.ts'
      - '.github/workflows/admin-save-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pair_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: pair_live_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pair_test -d pair_live_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr imagemagick
      - run: npm ci
      - name: Migrate disposable PostgreSQL only
        run: |
          npm run db:migrate -- --apply
          npm run db:migrate -- --validate
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
