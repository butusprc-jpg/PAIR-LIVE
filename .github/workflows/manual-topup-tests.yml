name: Manual topup PostgreSQL tests
on:
  push:
    branches: [feat/pair-live-v1, feat/pair-live-withdrawal-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pair_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: pair_live_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pair_test -d pair_live_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      TOPUP_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
      WALLET_TEST_DATABASE_URL: postgresql://pair_test:synthetic_test_password@127.0.0.1:5432/pair_live_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing OCR test dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick tesseract-ocr
      - run: npm ci
      - name: Install and validate isolated test schema
        run: |
          node --import tsx scripts/migrate.ts --apply
          node --import tsx scripts/migrate.ts --validate
      - run: npm test
      - run: npm run build
